# Render Blueprint: puts the app online as two web services (https://render.com/docs/blueprint-spec).
#   kissena-api  = the FastAPI backend (reads the cached data committed in backend/data/cache)
#   kissena-web  = the Next.js frontend
# In Render: New > Blueprint > pick this repo. Values marked "sync: false" are asked for
# in the Render dashboard, so secrets never go in this file. See README "Deploying to Render".

services:
  - type: web
    name: kissena-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # Render tells the app which port to use through $PORT.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # The frontend's address, so the browser may call the API.
      - key: FRONTEND_ORIGIN
        sync: false
      - key: SNOWFLAKE_ACCOUNT
        sync: false
      - key: SNOWFLAKE_USER
        sync: false
      - key: SNOWFLAKE_PAT
        sync: false
      - key: SNOWFLAKE_ROLE
        sync: false
      - key: SNOWFLAKE_WAREHOUSE
        sync: false

  - type: web
    name: kissena-web
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start -- --port $PORT
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      # redeploy after changing them.
      # The backend's api address
      - key: NEXT_PUBLIC_API_URL
        sync: false
      # This site's own web address
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
